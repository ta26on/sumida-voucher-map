<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#174b55"><title>すみだ商品券 店舗検索</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="wrap head"><div><div class="eyebrow">SUMIDA SHOP SEARCH · PROTOTYPE</div><h1>すみだ商品券 店舗検索</h1><p>公式掲載情報から探す、わたしたちの店舗リスト</p></div><span class="count" id="total">読み込み中</span></div></header>
<main class="wrap"><section class="searchpanel"><label for="q">店舗名・住所・カテゴリから探す</label><div class="searchrow"><input id="q" type="search" placeholder="例：パン、立川、マルエツ" autocomplete="off"><button id="clear" class="light" type="button">クリア</button></div><div class="filters"><div><label for="area">地域</label><select id="area"><option value="">すべての地域</option></select></div><div><label for="category">カテゴリ</label><select id="category"><option value="">すべてのカテゴリ</option></select></div><div><label for="ticket">使える券種</label><select id="ticket"><option value="">すべて</option><option value="a">A券が使える</option><option value="b">B券が使える</option><option value="b_only">B券のみ</option></select></div><div><label for="kind">掲載の種類</label><select id="kind"><option value="">すべて</option><option value="individual_store">個別店舗</option><option value="other">施設・チェーン単位</option></select></div></div></section>
<div class="summary"><div><strong id="resultCount">—</strong><span> 件の検索結果</span><div class="sub">公式掲載情報です。現在の利用可否は店頭でもご確認ください。</div></div><button id="share" type="button" class="light">検索条件を共有</button></div>
<div id="results" class="results" aria-live="polite"></div><div class="pager"><button id="more" class="light" type="button">さらに表示</button></div>
</main><dialog id="detail"><div class="dialoghead"><h2 id="dname"></h2><button id="close" type="button" class="light">閉じる</button></div><div id="dbody"></div></dialog>
<footer class="wrap">非公式プロトタイプ · データ出典：墨田区商店街連合会 公開店舗一覧 · 公式情報は最新とは限りません。<br>独自の現地確認・共同編集機能は今後実装予定です。</footer><script src="app.js" defer></script></body></html>
